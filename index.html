<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Forex Edge - Pro Trading Academy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-card: rgba(18, 24, 38, 0.85);
      --bg-sidebar: #0f1523;
      --accent-blue: #00f2fe;
      --accent-purple: #4facfe;
      --accent-green: #00e676;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-glow: 0 8px 32px 0 rgba(0, 242, 254, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

    /* Top Navigation Header */
    header {
      background: rgba(15, 21, 35, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .header-actions { display: flex; align-items: center; gap: 15px; }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .btn-auth {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #050b14;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
    }

    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4); }

    /* Layout Structure */
    .app-container { display: flex; height: calc(100vh - 65px); }

    /* Left Sidebar - TradeInsight Style */
    sidebar {
      width: 360px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 1.2rem;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border-radius: 8px;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .modules-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    /* Accordion Modules */
    .module-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 0.8rem;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .module-card:hover { border-color: rgba(0, 242, 254, 0.3); }

    .module-header {
      padding: 0.9rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.01);
    }

    .module-title-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .module-badge {
      font-size: 0.7rem;
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-blue);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 242, 254, 0.2);
    }

    .lesson-list {
      list-style: none;
      display: none;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border-color);
    }

    .module-card.active .lesson-list { display: block; }

    .lesson-item {
      padding: 0.75rem 1.2rem 0.75rem 2.4rem;
      font-size: 0.83rem;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .lesson-item:hover, .lesson-item.active {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.15), transparent);
      color: var(--accent-blue);
      border-left: 3px solid var(--accent-blue);
    }

    /* Main Content Dashboard */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      background: radial-gradient(circle at top right, rgba(0, 242, 254, 0.05), transparent 50%);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1.2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: var(--glass-glow);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .stat-info h4 { font-size: 0.8rem; color: var(--text-sub); }
    .stat-info p { font-size: 1.3rem; font-weight: 700; color: white; }

    .content-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .content-box h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #fff, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .paragraph-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-blue);
      padding: 1.2rem 1.5rem;
      border-radius: 0 12px 12px 0;
      margin-bottom: 1.2rem;
      font-size: 0.95rem;
      color: #cbd5e1;
      transition: all 0.3s;
    }

    .paragraph-card:hover {
      background: rgba(255, 255, 255, 0.04);
      transform: translateX(4px);
    }

    /* Modal - TradeInsight Premium Auth */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 11, 20, 0.85);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-overlay.active { display: flex; }

    .auth-card {
      background: #111726;
      border: 1px solid rgba(0, 242, 254, 0.3);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 242, 254, 0.15);
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 20px; right: 20px;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h2 { font-size: 1.6rem; color: white; margin-bottom: 0.3rem; }
    .auth-header p { font-size: 0.85rem; color: var(--text-sub); }

    .input-field {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .input-field i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    .input-field input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      border-radius: 10px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }

    .input-field input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    .btn-submit-action {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .status-msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: #f59e0b;
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      sidebar { width: 100%; height: 300px; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-chart-line"></i></div>
      <span>APEX FOREX EDGE</span>
    </div>
    <div class="header-actions">
      <div class="user-badge"><i class="fa-solid fa-shield-halved"></i> Telegram OTP Secured</div>
      <button class="btn-auth" onclick="toggleModal(true)"><i class="fa-solid fa-user-plus"></i> Register / Login</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <sidebar>
      <div class="sidebar-header">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Barnoota barbaadi...">
        </div>
      </div>
      <div class="modules-scroll" id="modulesContainer">
        <!-- Dynamic Accordion Modules -->
      </div>
    </sidebar>

    <!-- Main Course Content Area -->
    <main>
      <!-- Top Stat Cards -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-layer-group"></i></div>
          <div class="stat-info">
            <h4>Moojuloota Guutuu</h4>
            <p>15 Modules</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-book-open"></i></div>
          <div class="stat-info">
            <h4>Barnoota Baay'ina</h4>
            <p>45 Lessons</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-paragraph"></i></div>
          <div class="stat-info">
            <h4>Keeyyattoota Tarree</h4>
            <p>50 Keeyyattoota</p>
          </div>
        </div>
      </div>

      <!-- Main Lesson Render Area -->
      <div class="content-box" id="mainContent">
        <!-- Selected lesson content goes here -->
      </div>
    </main>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <i class="fa-solid fa-xmark close-modal" onclick="toggleModal(false)"></i>
      <div class="auth-header">
        <h2>Apex Account</h2>
        <p>Telegram Bot OTP'n Galmaa'aa</p>
      </div>

      <div id="stepRequest">
        <div class="input-field">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="emailInput" placeholder="Email (fkn: example@gmail.com)">
        </div>
        <div class="input-field">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="passwordInput" placeholder="Password">
        </div>
        <button class="btn-submit-action" onclick="handleOtpRequest()">OTP Ergafadhu (Telegram)</button>
      </div>

      <div id="stepVerify" style="display: none;">
        <div class="input-field">
          <i class="fa-solid fa-key"></i>
          <input type="number" id="otpInput" placeholder="Digit 4 OTP galchi">
        </div>
        <button class="btn-submit-action" style="background: var(--accent-green);" onclick="handleOtpVerify()">Verification Xumuri</button>
      </div>

      <div class="status-msg" id="statusMessage"></div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://apex-forex-backend.onrender.com';

    // 15 Modules, 45 Lessons, 50 Paragraphs Dataset
    const modulesData = Array.from({ length: 15 }, (_, m) => ({
      id: m + 1,
      title: `Moojulii ${m + 1}: Smart Money Concepts & Liquidity`,
      lessons: Array.from({ length: 3 }, (_, l) => {
        const lessonId = m * 3 + l + 1;
        return {
          id: lessonId,
          title: `Barnoota ${lessonId}: SMC Trading Strategy Part ${l + 1}`,
          paragraphs: [
            `Keeyyata ${lessonId}.1: SMC (Smart Money Concepts) gabaa Forex keessatti sosochii bankoota gurguddoo fi dhaabbilee maallaqaa hordofuuf mala saayinsawaa dha. Structure shift fi Liquidity Sweep addaan baafachuun murteessaadha.`,
            `Keeyyata ${lessonId}.2: Order Block (OB) fi Fair Value Gap (FVG) irratti xiyyeeffachuudhaan, entry gabaa keessaa madaalawaa ta'e madaaluun ni danda'ama. Stop Loss yeroo hunda swing high/low booda kaawwamuu qaba.`,
            `Keeyyata ${lessonId}.3: Risk Management %1 ykn %2 qofa trade tokko irratti fayyadamuun bu'aa yeroo dheeraatiif kiiloo murteessaadha. Trading Discipline fi Trading Journal qabaachuun dirqama.`
          ]
        };
      })
    }));

    function renderSidebarModules() {
      const container = document.getElementById('modulesContainer');
      container.innerHTML = modulesData.map(mod => `
        <div class="module-card ${mod.id === 1 ? 'active' : ''}">
          <div class="module-header" onclick="toggleModuleAccordion(this)">
            <span class="module-title-text"><i class="fa-solid fa-folder"></i> ${mod.title}</span>
            <span class="module-badge">3 Lessons</span>
          </div>
          <ul class="lesson-list">
            ${mod.lessons.map(les => `
              <li class="lesson-item ${les.id === 1 ? 'active' : ''}" onclick="selectLesson(${les.id}, this)">
                <span><i class="fa-regular fa-file-lines"></i> \${les.title}</span>
                <i class="fa-solid fa-chevron-right" style="font-size:0.7rem;"></i>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
    }

    function toggleModuleAccordion(headerElem) {
      const card = headerElem.parentElement;
      card.classList.toggle('active');
    }

    function selectLesson(lessonId, elem) {
      document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
      if(elem) elem.classList.add('active');

      let targetLesson = null;
      modulesData.forEach(m => {
        m.lessons.forEach(l => {
          if (l.id === lessonId) targetLesson = l;
        });
      });

      if (targetLesson) {
        const contentBox = document.getElementById('mainContent');
        contentBox.innerHTML = `
          <h1><i class="fa-solid fa-book-open-reader" style="color:var(--accent-blue);"></i> ${targetLesson.title}</h1>
          ${targetLesson.paragraphs.map(p => `
            <div class="paragraph-card">\${p}</div>
          `).join('')}
        `;
      }
    }

    function toggleModal(show) {
      const modal = document.getElementById('authModal');
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    async function handleOtpRequest() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const msg = document.getElementById('statusMessage');

      if (!email || !password) {
        msg.innerText = 'Email fi Password galchuu qabda!';
        return;
      }

      msg.innerText = 'OTP Telegram Bot keetti ergamaa jira...';
      try {
        const res = await fetch(`${BACKEND_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        msg.innerText = data.message;
        if (data.success) {
          document.getElementById('stepRequest').style.display = 'none';
          document.getElementById('stepVerify').style.display = 'block';
        }
      } catch (err) {
        msg.innerText = 'Error: Backend disconnect ta'ee jira!';
      }
    }

    async function handleOtpVerify() {
      const email = document.getElementById('emailInput').value;
      const otp = document.getElementById('otpInput').value;
      const msg = document.getElementById('statusMessage');

      msg.innerText = 'Mirkanaa'aa jira...';
      try {
        const res = await fetch(`${BACKEND_URL}/api/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });
        const data = await res.json();
        msg.innerText = data.message;
        if (data.success) {
          setTimeout(() => toggleModal(false), 1500);
        }
      } catch (err) {
        msg.innerText = 'OTP Error!';
      }
    }

    // Init App
    renderSidebarModules();
    selectLesson(1, null);
  </script>
</body>
</html>
